# Internal-only entry point for the backend. An internal NLB lives in the private
# subnets of vpc-backend and is NOT reachable from the internet. It is reachable
# from vpc-gateway over the VPC peering connection.
#
# __GATEWAY_CIDR__ is replaced by the pipeline with the gateway VPC CIDR
# (terraform output gateway_vpc_cidr), so the Service itself also restricts
# its source ranges to the gateway VPC.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: sentinel
  labels:
    app: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 80
  loadBalancerSourceRanges:
    - __GATEWAY_CIDR__
