# __BACKEND_HOST__ is replaced by the pipeline with the DNS name of the internal
# NLB that fronts the backend service in eks-backend. That name resolves to
# private IPs inside vpc-backend, which are reachable through the peering.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx-conf
  namespace: sentinel
data:
  default.conf: |
    server {
      listen 80;
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }
      location / {
        proxy_pass http://__BACKEND_HOST__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-proxy
  namespace: sentinel
  labels:
    app: gateway-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-proxy
  template:
    metadata:
      labels:
        app: gateway-proxy
    spec:
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: gateway-nginx-conf
